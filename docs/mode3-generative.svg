<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="100%" height="100%" style="background:#090d13; font-family:'Univers', 'Helvetica Neue', Arial, -apple-system, sans-serif;">
  <defs>
    <!-- Grid Pattern -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#131c26" stroke-width="0.75"/>
    </pattern>
    <radialGradient id="ledGlowLilac" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c489ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#c489ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="knobShade" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#2a3848"/>
      <stop offset="100%" stop-color="#121820"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Canvas with Grid -->
  <rect width="960" height="700" fill="#090d13"/>
  <rect width="960" height="700" fill="url(#grid)"/>

  <!-- Top Technical Header -->
  <g transform="translate(40, 36)">
    <text x="0" y="0" fill="#c489ff" font-size="11" font-weight="700" letter-spacing="2">03 // MODE 3</text>
    <text x="0" y="24" fill="#f0f6fc" font-size="24" font-weight="800" letter-spacing="-0.5">GENERATIVE KRELL ENGINE</text>
    <text x="0" y="44" fill="#7d8d9e" font-size="12" letter-spacing="0.2">AUTONOMOUS SOUNDSCAPE · RANDOM-WALK SEQUENCER · 5 EVOLVING VOICES · LUSH DEDICATED REVERB</text>

    <!-- Top Right Spec Box -->
    <g transform="translate(700, -8)">
      <rect x="0" y="0" width="180" height="48" rx="3" fill="#101720" stroke="#1d2836" stroke-width="1"/>
      <text x="12" y="18" fill="#7d8d9e" font-size="9" font-weight="700" letter-spacing="1">TOGGLE 1 POSITION</text>
      <text x="12" y="36" fill="#c489ff" font-size="14" font-weight="700" letter-spacing="0.5">▼ DOWN (GENERATIVE)</text>
    </g>
  </g>

  <!-- ==================== HOTHOUSE PEDAL CHASSIS ==================== -->
  <g transform="translate(290, 110)">
    <!-- Top audio/power jacks -->
    <rect x="45" y="-14" width="30" height="14" rx="2" fill="#202936" stroke="#334255" stroke-width="1"/>
    <text x="60" y="-4" fill="#58697c" font-size="7" font-weight="700" text-anchor="middle">IN</text>
    <rect x="110" y="-14" width="26" height="14" rx="2" fill="#202936" stroke="#334255" stroke-width="1"/>
    <text x="123" y="-4" fill="#58697c" font-size="7" font-weight="700" text-anchor="middle">9V</text>
    <rect x="180" y="-14" width="22" height="14" rx="2" fill="#1b2430" stroke="#334255" stroke-width="1"/>
    <text x="191" y="-4" fill="#58697c" font-size="6" font-weight="700" text-anchor="middle">USB</text>
    <rect x="250" y="-14" width="30" height="14" rx="2" fill="#c489ff" stroke="#c489ff" stroke-width="1"/>
    <text x="265" y="-4" fill="#090d13" font-size="7" font-weight="800" text-anchor="middle">OUT ●</text>

    <!-- Pedal Enclosure (125B Stompbox) -->
    <rect x="0" y="0" width="380" height="540" rx="16" fill="#11161d" stroke="#232f3e" stroke-width="2" filter="url(#shadow)"/>
    <rect x="14" y="14" width="352" height="512" rx="10" fill="none" stroke="#19222c" stroke-width="1.5"/>

    <!-- Screws -->
    <circle cx="16" cy="16" r="4" fill="#1a232e" stroke="#2e3d4e" stroke-width="1"/>
    <circle cx="364" cy="16" r="4" fill="#1a232e" stroke="#2e3d4e" stroke-width="1"/>
    <circle cx="16" cy="524" r="4" fill="#1a232e" stroke="#2e3d4e" stroke-width="1"/>
    <circle cx="364" cy="524" r="4" fill="#1a232e" stroke="#2e3d4e" stroke-width="1"/>

    <!-- Brand / Model Badge -->
    <text x="190" y="44" fill="#f0f6fc" font-size="14" font-weight="800" letter-spacing="4" text-anchor="middle">S P O R E</text>
    <text x="190" y="58" fill="#58697c" font-size="8" font-weight="600" letter-spacing="1.5" text-anchor="middle">ELECTROSMITH DAISY SEED × CLEVELAND MUSIC CO.</text>
    <line x1="40" y1="68" x2="340" y2="68" stroke="#1b2531" stroke-width="1"/>

    <!-- ==================== KNOB MATRIX (2x3) ==================== -->
    <!-- Row 1: Knobs 1, 2, 3 -->
    <!-- Knob 1 -->
    <g transform="translate(75, 115)">
      <circle cx="0" cy="0" r="28" fill="url(#knobShade)" stroke="#2d3c4e" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="21" fill="#141a22" stroke="#c489ff" stroke-width="1"/>
      <line x1="-12" y1="-12" x2="-16" y2="-16" stroke="#c489ff" stroke-width="3" stroke-linecap="round"/>
      <text x="0" y="38" fill="#f0f6fc" font-size="10" font-weight="700" text-anchor="middle">TEMPO</text>
      <text x="0" y="49" fill="#c489ff" font-size="8" font-weight="700" text-anchor="middle">KNOB 1</text>
    </g>

    <!-- Knob 2 -->
    <g transform="translate(190, 115)">
      <circle cx="0" cy="0" r="28" fill="url(#knobShade)" stroke="#2d3c4e" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="21" fill="#141a22" stroke="#c489ff" stroke-width="1"/>
      <line x1="0" y1="-7" x2="0" y2="-19" stroke="#c489ff" stroke-width="3" stroke-linecap="round"/>
      <text x="0" y="38" fill="#f0f6fc" font-size="10" font-weight="700" text-anchor="middle">RANGE</text>
      <text x="0" y="49" fill="#c489ff" font-size="8" font-weight="700" text-anchor="middle">KNOB 2</text>
    </g>

    <!-- Knob 3 -->
    <g transform="translate(305, 115)">
      <circle cx="0" cy="0" r="28" fill="url(#knobShade)" stroke="#2d3c4e" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="21" fill="#141a22" stroke="#c489ff" stroke-width="1"/>
      <line x1="12" y1="-12" x2="16" y2="-16" stroke="#c489ff" stroke-width="3" stroke-linecap="round"/>
      <text x="0" y="38" fill="#f0f6fc" font-size="10" font-weight="700" text-anchor="middle">TONE</text>
      <text x="0" y="49" fill="#c489ff" font-size="8" font-weight="700" text-anchor="middle">KNOB 3</text>
    </g>

    <!-- Row 2: Knobs 4, 5, 6 -->
    <!-- Knob 4 -->
    <g transform="translate(75, 205)">
      <circle cx="0" cy="0" r="28" fill="url(#knobShade)" stroke="#2d3c4e" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="21" fill="#141a22" stroke="#c489ff" stroke-width="1"/>
      <line x1="14" y1="10" x2="18" y2="13" stroke="#c489ff" stroke-width="3" stroke-linecap="round"/>
      <text x="0" y="38" fill="#f0f6fc" font-size="10" font-weight="700" text-anchor="middle">REVERB</text>
      <text x="0" y="49" fill="#c489ff" font-size="8" font-weight="700" text-anchor="middle">KNOB 4</text>
    </g>

    <!-- Knob 5 -->
    <g transform="translate(190, 205)">
      <circle cx="0" cy="0" r="28" fill="url(#knobShade)" stroke="#2d3c4e" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="21" fill="#141a22" stroke="#c489ff" stroke-width="1"/>
      <line x1="-12" y1="-12" x2="-16" y2="-16" stroke="#c489ff" stroke-width="3" stroke-linecap="round"/>
      <text x="0" y="38" fill="#f0f6fc" font-size="10" font-weight="700" text-anchor="middle">DENSITY</text>
      <text x="0" y="49" fill="#c489ff" font-size="8" font-weight="700" text-anchor="middle">KNOB 5</text>
    </g>

    <!-- Knob 6 -->
    <g transform="translate(305, 205)">
      <circle cx="0" cy="0" r="28" fill="url(#knobShade)" stroke="#2d3c4e" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="21" fill="#141a22" stroke="#c489ff" stroke-width="1"/>
      <line x1="0" y1="-7" x2="0" y2="-19" stroke="#c489ff" stroke-width="3" stroke-linecap="round"/>
      <text x="0" y="38" fill="#f0f6fc" font-size="10" font-weight="700" text-anchor="middle">DRIFT</text>
      <text x="0" y="49" fill="#c489ff" font-size="8" font-weight="700" text-anchor="middle">KNOB 6</text>
    </g>

    <!-- ==================== TOGGLE SWITCHES (Row 3) ==================== -->
    <!-- Toggle 1: MODE -->
    <g transform="translate(80, 298)">
      <rect x="-14" y="-22" width="28" height="44" rx="4" fill="#0d1218" stroke="#253242" stroke-width="1"/>
      <line x1="0" y1="-15" x2="0" y2="15" stroke="#1a232e" stroke-width="4" stroke-linecap="round"/>
      <!-- Bat: DOWN position (ACTIVE) -->
      <circle cx="0" cy="12" r="7" fill="#c489ff" stroke="#ffffff" stroke-width="1"/>
      <text x="0" y="33" fill="#c489ff" font-size="8.5" font-weight="800" text-anchor="middle">MODE</text>
      <text x="0" y="44" fill="#f0f6fc" font-size="7.5" font-weight="700" text-anchor="middle">GENERATIVE ▼</text>
    </g>

    <!-- Toggle 2: VARIANT (Scale) -->
    <g transform="translate(190, 298)">
      <rect x="-14" y="-22" width="28" height="44" rx="4" fill="#0d1218" stroke="#253242" stroke-width="1"/>
      <line x1="0" y1="-15" x2="0" y2="15" stroke="#1a232e" stroke-width="4" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="6" fill="#a4b3c6" stroke="#ffffff" stroke-width="1"/>
      <text x="0" y="33" fill="#f0f6fc" font-size="8.5" font-weight="800" text-anchor="middle">SCALE</text>
      <text x="0" y="44" fill="#7d8d9e" font-size="7.5" font-weight="600" text-anchor="middle">CHROM/PENT/MAJ</text>
    </g>

    <!-- Toggle 3: GLOBAL FX -->
    <g transform="translate(300, 298)">
      <rect x="-14" y="-22" width="28" height="44" rx="4" fill="#0d1218" stroke="#253242" stroke-width="1"/>
      <line x1="0" y1="-15" x2="0" y2="15" stroke="#1a232e" stroke-width="4" stroke-linecap="round"/>
      <!-- Dedicated Reverb Active note -->
      <circle cx="0" cy="-12" r="5" fill="#404c5e" stroke="#2a3646" stroke-width="1"/>
      <text x="0" y="33" fill="#7d8d9e" font-size="8.5" font-weight="800" text-anchor="middle">FX SEL</text>
      <text x="0" y="44" fill="#58697c" font-size="7.5" font-weight="600" text-anchor="middle">(BYPASSED)</text>
    </g>

    <!-- ==================== LEDS & FOOTSWITCHES ==================== -->
    <!-- LED 1 (Engaged) -->
    <circle cx="100" cy="385" r="14" fill="url(#ledGlowLilac)"/>
    <circle cx="100" cy="385" r="5" fill="#c489ff" stroke="#ffffff" stroke-width="1"/>
    <text x="100" y="403" fill="#7d8d9e" font-size="7.5" font-weight="700" text-anchor="middle">ACTIVE / MUTE</text>

    <!-- LED 2 (FX state) -->
    <circle cx="280" cy="385" r="5" fill="#1b2531" stroke="#37475b" stroke-width="1"/>
    <text x="280" y="403" fill="#7d8d9e" font-size="7.5" font-weight="700" text-anchor="middle">PRESET STATE</text>

    <!-- Footswitch 1 (Left: Mute / Bypass) -->
    <g transform="translate(100, 455)">
      <circle cx="0" cy="0" r="24" fill="#18212c" stroke="#314256" stroke-width="2"/>
      <circle cx="0" cy="0" r="17" fill="#243242" stroke="#485e7a" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="11" fill="#121820"/>
      <text x="0" y="34" fill="#f0f6fc" font-size="9" font-weight="700" text-anchor="middle">MUTE / ACTIVE</text>
      <text x="0" y="45" fill="#7d8d9e" font-size="7.5" font-weight="600" text-anchor="middle">FSW 1</text>
    </g>

    <!-- Footswitch 2 (Right: RE-SEED Action) -->
    <g transform="translate(280, 455)">
      <circle cx="0" cy="0" r="24" fill="#18212c" stroke="#c489ff" stroke-width="2"/>
      <circle cx="0" cy="0" r="17" fill="#2a1f3d" stroke="#c489ff" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="11" fill="#c489ff"/>
      <text x="0" y="34" fill="#c489ff" font-size="9" font-weight="800" text-anchor="middle">RE-SEED</text>
      <text x="0" y="45" fill="#f0f6fc" font-size="7.5" font-weight="700" text-anchor="middle">FSW 2 (TAP)</text>
    </g>
  </g>

  <!-- ==================== LEFT CALLOUT CARD (KNOBS 1, 4, FSW 1) ==================== -->
  <!-- Knob 1 Callout -->
  <g transform="translate(40, 195)">
    <line x1="220" y1="35" x2="330" y2="230" stroke="#c489ff" stroke-width="1" stroke-dasharray="2 3"/>
    <circle cx="330" cy="230" r="2.5" fill="#c489ff"/>
    <rect x="0" y="0" width="220" height="74" rx="4" fill="#0d131a" stroke="#1e2937" stroke-width="1"/>
    <text x="12" y="20" fill="#c489ff" font-size="9" font-weight="800" letter-spacing="1">(1) EVENT CLOCK TEMPO</text>
    <text x="12" y="38" fill="#f0f6fc" font-size="12" font-weight="700">20 – 90 BPM</text>
    <text x="12" y="53" fill="#7d8d9e" font-size="10">Slow evolving pulses to gentle burble</text>
    <text x="12" y="65" fill="#58697c" font-size="9">Governs note trigger interval pace</text>
  </g>

  <!-- Knob 4 Callout -->
  <g transform="translate(40, 295)">
    <line x1="220" y1="35" x2="330" y2="320" stroke="#c489ff" stroke-width="1" stroke-dasharray="2 3"/>
    <circle cx="330" cy="320" r="2.5" fill="#c489ff"/>
    <rect x="0" y="0" width="220" height="74" rx="4" fill="#0d131a" stroke="#1e2937" stroke-width="1"/>
    <text x="12" y="20" fill="#c489ff" font-size="9" font-weight="800" letter-spacing="1">(4) DEDICATED REVERB</text>
    <text x="12" y="38" fill="#f0f6fc" font-size="12" font-weight="700">30% – 95% Wet Mix</text>
    <text x="12" y="53" fill="#7d8d9e" font-size="10">Stereo SDRAM ReverbSc tail decay</text>
    <text x="12" y="65" fill="#58697c" font-size="9">Replaces global FX for maximum lushness</text>
  </g>

  <!-- FSW 1 Callout -->
  <g transform="translate(40, 480)">
    <line x1="220" y1="35" x2="365" y2="565" stroke="#c489ff" stroke-width="1" stroke-dasharray="2 3"/>
    <circle cx="365" cy="565" r="2.5" fill="#c489ff"/>
    <rect x="0" y="0" width="220" height="88" rx="4" fill="#0d131a" stroke="#1e2937" stroke-width="1"/>
    <text x="12" y="18" fill="#c489ff" font-size="9" font-weight="800" letter-spacing="1">[FSW 1] MUTE / EDIT</text>
    <text x="12" y="34" fill="#f0f6fc" font-size="11" font-weight="700">TAP: MUTE / UNMUTE</text>
    <text x="12" y="50" fill="#7d8d9e" font-size="9.5">Mutes voice output smoothly</text>
    <text x="12" y="64" fill="#ff7c3d" font-size="9.5" font-weight="700">Hold &gt;350 ms: FX Shift layer</text>
    <text x="12" y="78" fill="#58697c" font-size="9">Allows editing global delay/reverb for modes 1&amp;2</text>
  </g>

  <!-- ==================== RIGHT CALLOUT CARD (KNOBS 2, 3, 5, 6, TOGGLES, FSW 2) ==================== -->
  <!-- Knobs 2 & 5 Callout -->
  <g transform="translate(700, 160)">
    <line x1="0" y1="35" x2="-200" y2="230" stroke="#c489ff" stroke-width="1" stroke-dasharray="2 3"/>
    <circle cx="-200" cy="230" r="2.5" fill="#c489ff"/>
    <rect x="0" y="0" width="220" height="96" rx="4" fill="#0d131a" stroke="#1e2937" stroke-width="1"/>
    <text x="12" y="18" fill="#c489ff" font-size="9" font-weight="800" letter-spacing="1">(2) RANGE &amp; (5) DENSITY</text>
    <text x="12" y="36" fill="#f0f6fc" font-size="11" font-weight="700">K2: ±4 to ±30 Semitones</text>
    <text x="12" y="50" fill="#7d8d9e" font-size="9.5">Random-walk pitch boundary width</text>
    <text x="12" y="68" fill="#f0f6fc" font-size="11" font-weight="700">K5: Polyphonic Density</text>
    <text x="12" y="82" fill="#7d8d9e" font-size="9.5">Chord cluster chance &amp; voice activity</text>
  </g>

  <!-- Knobs 3 & 6 Callout -->
  <g transform="translate(700, 275)">
    <line x1="0" y1="35" x2="-85" y2="230" stroke="#c489ff" stroke-width="1" stroke-dasharray="2 3"/>
    <circle cx="-85" cy="230" r="2.5" fill="#c489ff"/>
    <rect x="0" y="0" width="220" height="96" rx="4" fill="#0d131a" stroke="#1e2937" stroke-width="1"/>
    <text x="12" y="18" fill="#c489ff" font-size="9" font-weight="800" letter-spacing="1">(3) TONE &amp; (6) DRIFT</text>
    <text x="12" y="36" fill="#f0f6fc" font-size="11" font-weight="700">K3: 300 Hz – 9 kHz Tone</text>
    <text x="12" y="50" fill="#7d8d9e" font-size="9.5">Dynamic brightness &amp; cutoff curve</text>
    <text x="12" y="68" fill="#f0f6fc" font-size="11" font-weight="700">K6: Chaotic Drift &amp; Sway</text>
    <text x="12" y="82" fill="#7d8d9e" font-size="9.5">Lorenz attractor sways filter &amp; detune</text>
  </g>

  <!-- Toggle 2 & FSW 2 RE-SEED Callout -->
  <g transform="translate(700, 390)">
    <line x1="0" y1="35" x2="-200" y2="410" stroke="#c489ff" stroke-width="1" stroke-dasharray="2 3"/>
    <circle cx="-200" cy="410" r="2.5" fill="#c489ff"/>
    <rect x="0" y="0" width="220" height="120" rx="4" fill="#0d131a" stroke="#1e2937" stroke-width="1"/>
    <text x="12" y="18" fill="#c489ff" font-size="9" font-weight="800" letter-spacing="1">[TOGGLE 2] HARMONIC SCALE</text>
    <text x="12" y="34" fill="#f0f6fc" font-size="10.5" font-weight="700">UP: CHROM · MID: PENTA · DN: MAJOR</text>
    <text x="12" y="48" fill="#7d8d9e" font-size="9.5">Quantizes random-walk pitch targets</text>
    <line x1="12" y1="58" x2="208" y2="58" stroke="#1e2937" stroke-width="1"/>
    <text x="12" y="74" fill="#c489ff" font-size="9" font-weight="800" letter-spacing="1">[FSW 2] RE-SEED ACTION</text>
    <text x="12" y="90" fill="#c489ff" font-size="11" font-weight="800">TAP: RE-SEED HARMONY &amp; TIMBRE</text>
    <text x="12" y="104" fill="#f0f6fc" font-size="9.5">Instant hardware RNG roll of fresh landscape</text>
    <text x="12" y="114" fill="#7d8d9e" font-size="8.5">Hold &gt;350 ms: enter preset save/recall mode</text>
  </g>

  <!-- Bottom Technical Footer Bar -->
  <g transform="translate(40, 665)">
    <line x1="0" y1="0" x2="880" y2="0" stroke="#1a232e" stroke-width="1"/>
    <text x="0" y="18" fill="#58697c" font-size="10" font-family="monospace">CHAOS: LORENZ ATTRACTOR (SMOOTH) + LOGISTIC MAP (STEPPED) · REVERBSC FEEDBACK 0.90</text>
    <text x="880" y="18" fill="#c489ff" font-size="10" font-family="monospace" text-anchor="end">FIRMWARE V0.5.3</text>
  </g>
</svg>
